<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f2">
  <title>{% block title %}How Original Is My Idea?{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('index') }}"><span class="brand-star" aria-hidden="true">✳</span> idea, meet world<span class="brand-dot">.</span></a>
      <span class="header-note"><span class="status-dot"></span> A little curiosity goes a long way</span>
    </header>
    <main id="main">{% block content %}{% endblock %}</main>
    <footer class="site-footer"><span>Made for your next “what if.” <span aria-hidden="true">♡</span></span><span>Semantic neighbors. New perspectives.</span></footer>
  </div>
</body>
</html>
